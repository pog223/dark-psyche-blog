name: Post Blog Article

on:
  schedule:
    - cron: '0 14 * * 1,3,5'  # auto-managed — Mon/Wed/Fri at 2pm UTC (4am HST)
  workflow_dispatch:
    inputs:
      force_topic:
        description: 'Optional topic override (leave blank for auto-select)'
        required: false
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit analytics_state.json updates

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and publish blog post
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          WP_SITE:                ${{ secrets.WP_SITE }}
          WP_TOKEN:               ${{ secrets.WP_TOKEN }}
          YOUTUBE_API_KEY:        ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID:     ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_TOKEN_B64:      ${{ secrets.YOUTUBE_TOKEN_B64 }}
          AMAZON_ASSOCIATE_TAG:   ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          AMAZON_ACCESS_KEY:      ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY:      ${{ secrets.AMAZON_SECRET_KEY }}
          FORCE_TOPIC:            ${{ github.event.inputs.force_topic }}
        run: python scripts/generate_post.py

      - name: Commit updated analytics state
        run: |
          git config user.name  "Dark Psyche Bot"
          git config user.email "bot@darkpsychelab.com"
          git add config/analytics_state.json config/topics.json
          git diff --staged --quiet || git commit -m "chore: update analytics state [skip ci]"
          git push
